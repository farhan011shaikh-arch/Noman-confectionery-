<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noman Confectionery</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fff6ea;
}
header{
  background:#a52a2a;
  color:white;
  padding:15px;
  text-align:center;
}
header img{
  width:80px;
  border-radius:50%;
}
nav{
  background:#ffddb3;
  padding:10px;
  text-align:center;
}
nav button{
  margin:5px;
  padding:8px 14px;
  border:none;
  border-radius:5px;
  background:#a52a2a;
  color:white;
  cursor:pointer;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 5px #aaa;
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}
.price{
  color:green;
  font-weight:bold;
}
.buy{
  background:#28a745;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  margin-top:5px;
}
.del{
  background:red;
  color:white;
  border:none;
  padding:5px;
  margin-top:5px;
}

/* Admin */
#admin{
  display:none;
  padding:15px;
  background:#fff;
  margin:10px;
  border-radius:10px;
}

input,select{
  width:100%;
  padding:6px;
  margin:5px 0;
}

.instagram{
  position:fixed;
  bottom:90px;
  right:15px;
  background:#E1306C;
  color:white;
  padding:12px;
  border-radius:50%;
  text-decoration:none;
  font-size:20px;
}

.whatsapp{
  position:fixed;
  bottom:20px;
  right:15px;
  background:#25D366;
  color:white;
  padding:12px;
  border-radius:50%;
  text-decoration:none;
  font-size:20px;
}
footer{
  text-align:center;
  padding:10px;
  background:#222;
  color:white;
}
</style>
</head>

<body>

<header>
<img src="https://i.imgur.com/3XqJZpC.png">
<h2>Noman Confectionery</h2>
<p>Bakery • Grocery • Dry Fruits</p>
</header>

<nav>
<button onclick="filter('all')">All</button>
<button onclick="filter('bakery')">Bakery</button>
<button onclick="filter('grocery')">Grocery</button>
<button onclick="filter('dry')">Dry Fruits</button>
<button onclick="unlock()">Admin</button>
</nav>

<div id="admin">
<h3>Add Product</h3>
<input id="pname" placeholder="Product name">
<input id="pprice" placeholder="Price">
<select id="pcat">
  <option value="bakery">Bakery</option>
  <option value="grocery">Grocery</option>
  <option value="dry">Dry Fruits</option>
</select>
<input type="file" id="pimg">
<button onclick="addProduct()">Add</button>
</div>

<div class="products" id="productList"></div>

<a class="instagram" href="https://www.instagram.com/" target="_blank">📸</a>
<a class="whatsapp" href="https://wa.me/91XXXXXXXXXX" target="_blank">💬</a>

<footer>
© 2026 Noman Confectionery
</footer>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function render(cat="all"){
  let html="";
  products.forEach((p,i)=>{
    if(cat=="all" || p.cat==cat){
      html+=`
      <div class="card">
        <img src="${p.img}">
        <h4>${p.name}</h4>
        <div class="price">₹${p.price}</div>
        <a class="buy" href="https://wa.me/91XXXXXXXXXX?text=I want ${p.name}">Buy</a>
        <br>
        <button class="del" onclick="del(${i})">Delete</button>
      </div>`;
    }
  });
  document.getElementById("productList").innerHTML=html;
}

function addProduct(){
  let file=document.getElementById("pimg").files[0];
  let reader=new FileReader();
  reader.onload=function(){
    products.push({
      name:pname.value,
      price:pprice.value,
      cat:pcat.value,
      img:reader.result
    });
    localStorage.setItem("products",JSON.stringify(products));
    render();
  }
  reader.readAsDataURL(file);
}

function del(i){
  products.splice(i,1);
  localStorage.setItem("products",JSON.stringify(products));
  render();
}

function filter(cat){ render(cat); }

function unlock(){
  let p=prompt("Enter Admin Password");
  if(p=="1234"){
    document.getElementById("admin").style.display="block";
  }
}

render();
</script>

</body>
</html>

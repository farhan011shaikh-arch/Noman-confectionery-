
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noman Confectionery</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff7ee;
}

header{
    background:#8b0000;
    color:white;
    padding:15px;
    text-align:center;
}

.instagram-btn{
    display:inline-block;
    margin-top:10px;
    background:#E1306C;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    text-decoration:none;
    font-weight:bold;
}

nav{
    text-align:center;
    padding:10px;
    background:#f5f5f5;
}

nav button{
    margin:5px;
    padding:8px 12px;
    border:none;
    border-radius:5px;
    background:#8b0000;
    color:white;
    cursor:pointer;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 5px #aaa;
    text-align:center;
}

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:8px;
}

.price{
    color:green;
    font-weight:bold;
}

.buy{
    background:#25D366;
    color:white;
    border:none;
    padding:8px;
    width:100%;
    border-radius:5px;
    margin-top:5px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:10px;
}
</style>
</head>

<body>

<header>
    <h2>Noman Confectionery</h2>
    <p>Bakery • Dry Fruits • Grocery</p>

    <a class="instagram-btn"
       href="https://www.instagram.com/numan.confectionery.kunda"
       target="_blank">
       📸 Follow on Instagram
    </a>
</header>

<nav>
    <button onclick="filter('all')">All</button>
    <button onclick="filter('bakery')">Bakery</button>
    <button onclick="filter('dry')">Dry Fruits</button>
    <button onclick="filter('grocery')">Grocery</button>
</nav>

<div class="products" id="productList"></div>

<footer>
    © 2026 Noman Confectionery | WhatsApp Order Available
</footer>

<script>
const products = [
 {name:"Chocolate Cake", price:"₹450", cat:"bakery", img:"https://i.imgur.com/8Km9tLL.jpg"},
 {name:"Bread", price:"₹40", cat:"bakery", img:"https://i.imgur.com/5R4zK2D.jpg"},
 {name:"Dry Fruits Mix", price:"₹320", cat:"dry", img:"https://i.imgur.com/xpK8D1I.jpg"},
 {name:"Almonds 250g", price:"₹380", cat:"dry", img:"https://i.imgur.com/5ZQ4CzB.jpg"},
 {name:"Sugar 1kg", price:"₹55", cat:"grocery", img:"https://i.imgur.com/f6kQGJZ.jpg"},
 {name:"Tea 250g", price:"₹120", cat:"grocery", img:"https://i.imgur.com/tb7rY2k.jpg"}
];

function showProducts(list){
    document.getElementById("productList").innerHTML =
    list.map(p=>`
        <div class="card">
            <img src="${p.img}">
            <h4>${p.name}</h4>
            <p class="price">${p.price}</p>
            <a href="https://wa.me/918369701874?text=I want to buy ${p.name}">
                <button class="buy">Buy on WhatsApp</button>
            </a>
        </div>
    `).join("");
}

function filter(cat){
    if(cat==="all") showProducts(products);
    else showProducts(products.filter(p=>p.cat===cat));
}

showProducts(products);
</script>

</body>
</html>

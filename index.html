<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noman Confectionery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- QR Scanner Library -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#fff5ee}
header{background:#8b0000;color:white;padding:15px;display:flex;align-items:center;gap:15px}
header img{width:60px;height:60px;border-radius:50%}
nav{background:#b22222;padding:10px;text-align:center}
nav button{margin:5px;padding:8px;border:none;border-radius:5px;font-weight:bold}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:20px}
.card{background:white;border-radius:10px;padding:15px;text-align:center;box-shadow:0 0 10px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.price{color:green;font-size:18px;font-weight:bold}

.btn{display:inline-block;margin:5px;padding:8px 12px;background:green;color:white;text-decoration:none;border-radius:5px}
.del{background:red}

#admin,#order,#scanner{padding:20px;background:#fff3cd;margin:20px}
input,textarea,select,button{width:100%;padding:8px;margin:5px}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25d366;color:white;
padding:15px;border-radius:50%;font-size:22px;text-decoration:none
}

footer{background:#222;color:white;text-align:center;padding:15px}
</style>
</head>

<body>

<header>
<img src="paytm-qr.jpg">
<div>
<h2>Noman Confectionery</h2>
<p>Bakery • Dry Fruits • Grocery</p>
</div>
</header>

<nav>
<button onclick="filter('all')">All</button>
<button onclick="filter('bakery')">Bakery</button>
<button onclick="filter('dry')">Dry Fruits</button>
<button onclick="filter('grocery')">Grocery</button>
</nav>

<!-- PRODUCTS -->
<section class="products" id="productList"></section>

<!-- ORDER -->
<section id="order">
<h2>Order Now</h2>
<input id="oname" placeholder="Your Name">
<input id="ophone" placeholder="Phone Number">
<textarea id="oaddress" placeholder="Address"></textarea>
<input id="oproduct" placeholder="Product Name">
<button onclick="sendOrder()">Send Order on WhatsApp</button>
</section>

<!-- SCANNER -->
<section id="scanner">
<h2>Scan QR Code</h2>
<div id="reader" style="width:300px;margin:auto;"></div>
<p id="scanResult"></p>
</section>

<!-- ADMIN -->
<section id="admin">
<h2>Admin Panel</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="unlock()">Unlock</button>

<div id="adminBox" style="display:none">
<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price">

<select id="pcat">
<option value="bakery">Bakery</option>
<option value="dry">Dry Fruits</option>
<option value="grocery">Grocery</option>
</select>

<input type="file" id="pimg">
<button onclick="addProduct()">Add Product</button>
</div>
</section>

<a class="whatsapp" href="https://wa.me/918369701874">💬</a>

<footer>© 2026 Noman Confectionery</footer>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function render(cat="all"){
 let html="";
 products.forEach((p,i)=>{
  if(cat=="all" || p.cat==cat){
   html+=`
   <div class="card">
    <img src="${p.img}">
    <h3>${p.name}</h3>
    <p class="price">${p.price}</p>
    <a class="btn" href="https://wa.me/918369701874?text=Order ${p.name}">Buy</a>
    <button class="btn del" onclick="deleteProduct(${i})">Delete</button>
   </div>`;
  }
 });
 document.getElementById("productList").innerHTML=html;
}

function filter(cat){ render(cat); }

function unlock(){
 if(pass.value=="1234"){
  adminBox.style.display="block";
 }
}

function addProduct(){
 let file=document.getElementById("pimg").files[0];
 let reader=new FileReader();
 reader.onload=function(){
  products.push({
   name:pname.value,
   price:pprice.value,
   cat:pcat.value,
   img:reader.result
  });
  localStorage.setItem("products",JSON.stringify(products));
  render();
 };
 reader.readAsDataURL(file);
}

function deleteProduct(i){
 products.splice(i,1);
 localStorage.setItem("products",JSON.stringify(products));
 render();
}

function sendOrder(){
 let msg=`Order:%0AName:${oname.value}%0APhone:${ophone.value}%0AAddress:${oaddress.value}%0AProduct:${oproduct.value}`;
 window.open("https://wa.me/918369701874?text="+msg);
}

/* QR SCANNER */
let scanner = new Html5Qrcode("reader");
scanner.start(
 { facingMode: "environment" },
 { fps: 10, qrbox: 200 },
 qr => document.getElementById("scanResult").innerText = "Scanned: " + qr
);

render();
</script>

</body>
</html>
